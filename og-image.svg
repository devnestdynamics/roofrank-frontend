<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aaa8f" stop-opacity="0.16"/>
      <stop offset="65%" stop-color="#7aaa8f" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#7aaa8f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f7f4ef"/>

  <!-- Subtle sage halo behind the brand mark -->
  <circle cx="600" cy="175" r="240" fill="url(#halo)"/>

  <!-- Top-left wordmark: mini Deckers mark + RoofRank.io -->
  <g transform="translate(60, 60)">
    <rect width="30" height="30" rx="7" fill="#1c4a35"/>
    <path d="M5 12 L15 6 L25 12" stroke="#7aaa8f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="5" y="15" width="20" height="2.2" rx=".4" fill="#7aaa8f"/>
    <rect x="5" y="19" width="20" height="2.2" rx=".4" fill="#7aaa8f" opacity=".7"/>
    <rect x="5" y="23" width="20" height="2.2" rx=".4" fill="#7aaa8f" opacity=".4"/>
    <text x="44" y="22" font-family="Georgia, 'Playfair Display', serif" font-size="20" font-weight="500" fill="#1c1f1c">RoofRank</text>
  </g>

  <!-- Center: large Deckers mark (140x140) -->
  <g transform="translate(530, 105)">
    <rect width="140" height="140" rx="32" fill="#1c4a35"/>
    <path d="M23 56 L70 28 L117 56" stroke="#7aaa8f" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="23" y="70" width="94" height="10" rx="2" fill="#7aaa8f"/>
    <rect x="23" y="88" width="94" height="10" rx="2" fill="#7aaa8f" opacity=".7"/>
    <rect x="23" y="106" width="94" height="10" rx="2" fill="#7aaa8f" opacity=".4"/>
  </g>

  <!-- H1 — two lines, serif, italic accent on line 2 -->
  <g text-anchor="middle">
    <text x="600" y="345" font-family="Georgia, 'Playfair Display', serif" font-size="56" font-weight="400" fill="#1c1f1c" letter-spacing="-1.5">
      Know if a multifamily cashflows
    </text>
    <text x="600" y="415" font-family="Georgia, 'Playfair Display', serif" font-size="56" font-weight="400" font-style="italic" fill="#1c4a35" letter-spacing="-1.5">
      — in 30 seconds.
    </text>
  </g>

  <!-- Data wedge subhead -->
  <text x="600" y="490" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="22" fill="#6b7168" letter-spacing="0.3">
    Live mortgage rates  ·  Real rents  ·  Actual property tax
  </text>

  <!-- Markets bottom strip -->
  <text x="600" y="555" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="13" fill="#6b7168" letter-spacing="3.5" font-weight="600">
    LYNN  ·  WORCESTER  ·  SALEM
  </text>
</svg>
