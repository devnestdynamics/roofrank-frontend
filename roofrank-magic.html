<!DOCTYPE html>
<html lang="en">
<head>
<script>
// Auto-detect API base — localhost dev backend in local, prod elsewhere.
window.ROOFRANK_API_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:3000/api'
  : 'https://api.roofrank.io/api';
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoofRank — Signing you in</title>
<link href="https://fonts.bunny.net/css2?family=Playfair+Display:ital,wght@0,500&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#f7f4ef; --white:#fff; --ink:#1c1f1c; --muted:#6b7168; --faint:#a8ad9f;
  --forest:#1c4a35; --forest-2:#2d6448; --sage:#7aaa8f;
  --sage-dim:rgba(122,170,143,.1); --sage-border:rgba(122,170,143,.25);
  --pass:#a03030; --border:#e0d9cf;
  --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif;
}
html{color-scheme:light}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}

.brand{display:flex;align-items:center;gap:8px;text-decoration:none;margin-bottom:2rem}
.brand-mark{width:28px;height:28px}
.brand-name{font-family:var(--serif);font-size:1.05rem;font-weight:500;color:var(--ink)}

.card{width:100%;max-width:440px;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:2.5rem 2rem 1.85rem;box-shadow:0 10px 40px rgba(28,31,28,.08);text-align:center}
.icon{width:60px;height:60px;border-radius:14px;background:var(--sage-dim);border:1px solid var(--sage-border);display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem}
.icon.error{background:rgba(160,48,48,.08);border-color:rgba(160,48,48,.25)}
.icon svg{width:30px;height:30px;stroke:var(--forest);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon.error svg{stroke:var(--pass)}
.icon.spinner{background:transparent;border:none}
.spinner-ring{width:42px;height:42px;border:3px solid var(--sage-border);border-top-color:var(--forest);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

h1{font-family:var(--serif);font-size:1.55rem;font-weight:500;line-height:1.2;margin-bottom:.55rem}
.sub{font-size:.88rem;color:var(--muted);line-height:1.65;margin-bottom:1.5rem}
.actions{display:flex;flex-direction:column;gap:.5rem;align-items:center;font-size:.85rem}
.btn{background:var(--forest);color:#fff;border:none;padding:.65rem 1.4rem;border-radius:10px;font-size:.88rem;font-weight:500;cursor:pointer;font-family:var(--sans);text-decoration:none;display:inline-block}
.btn:hover{background:var(--forest-2)}
.btn-link{background:none;color:var(--muted);text-decoration:none;font-size:.78rem;padding:6px 10px;cursor:pointer;border:none;font-family:var(--sans)}
.btn-link:hover{color:var(--forest)}

.state{display:none}
.state.on{display:block;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
<script src="api.js"></script>
</head>
<body>

<a href="roofrank-landing.html" class="brand">
  <svg class="brand-mark" viewBox="0 0 30 30" fill="none">
    <rect width="30" height="30" rx="7" fill="#1c4a35"/>
    <path d="M5 12 L15 6 L25 12" stroke="#7aaa8f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="5" y="15" width="20" height="2.2" rx=".4" fill="#7aaa8f"/>
    <rect x="5" y="19" width="20" height="2.2" rx=".4" fill="#7aaa8f" opacity=".7"/>
    <rect x="5" y="23" width="20" height="2.2" rx=".4" fill="#7aaa8f" opacity=".4"/>
  </svg>
  <span class="brand-name">RoofRank</span>
</a>

<!-- VERIFYING — initial state -->
<div class="card state on" id="state-verify">
  <div class="icon spinner"><div class="spinner-ring"></div></div>
  <h1>Signing you in…</h1>
  <p class="sub">Verifying your magic link.</p>
</div>

<!-- SUCCESS — about to redirect -->
<div class="card state" id="state-success">
  <div class="icon">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h1>Welcome to RoofRank</h1>
  <p class="sub">Taking you to your dashboard…</p>
</div>

<!-- ERROR — token invalid or expired -->
<div class="card state" id="state-error">
  <div class="icon error">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  </div>
  <h1>Link expired or already used</h1>
  <p class="sub" id="errorMsg">Magic links expire after 15 minutes and only work once. Request a new one.</p>
  <div class="actions">
    <a href="roofrank-onboard.html" class="btn">Send a new link →</a>
    <a href="roofrank-login.html" class="btn-link">Sign in with a password instead</a>
  </div>
</div>

<script>
// Token verification flow
const params = new URLSearchParams(location.search);
const token = params.get('token');
const returnTo = params.get('returnTo') || 'roofrank-dashboard.html';

function showState(id) {
  document.querySelectorAll('.state').forEach(s => s.classList.remove('on'));
  document.getElementById('state-' + id).classList.add('on');
}

async function verifyToken() {
  if (!token) {
    showState('error');
    document.getElementById('errorMsg').textContent = 'No token in the link. Request a new one to sign in.';
    return;
  }

  try {
    // AuthAPI.verifyMagicLink stores the access + refresh tokens via
    // Auth.setToken/setRefresh as part of the call, and returns the full
    // response (including returnTo, which backend echoes from the request).
    const result = await AuthAPI.verifyMagicLink(token);

    showState('success');
    setTimeout(() => {
      // Backend's returnTo wins over URL param if present (it's the path
      // the user originally requested when they submitted the email).
      window.location.replace(result.returnTo || returnTo);
    }, 800);
  } catch (e) {
    console.error('[magic] verify failed', e);
    showState('error');
    if (e.status === 410 || e.status === 401) {
      document.getElementById('errorMsg').textContent = e.message ||
        'This link has expired or already been used. Magic links work once and last 15 minutes.';
    } else {
      document.getElementById('errorMsg').textContent =
        'Couldn\'t verify the link. Try requesting a new one.';
    }
  }
}

verifyToken();
</script>

</body>
</html>
