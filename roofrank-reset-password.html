<!DOCTYPE html>
<html lang="en">
<head>
<script>
window.ROOFRANK_API_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:3000/api'
  : 'https://api.roofrank.io/api';
</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoofRank — Reset password</title>
<link href="https://fonts.bunny.net/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#f7f4ef;--cream-2:#f0ece4;--cream-3:#e6e0d5;--white:#fff;--ink:#1c1f1c;--muted:#6b7168;--faint:#a8ad9f;--forest:#1c4a35;--forest-2:#2d6448;--sage:#7aaa8f;--sage-dim:rgba(122,170,143,.12);--sage-border:rgba(122,170,143,.28);--rose:#a03030;--border:#e5dfd4;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
html{color-scheme:light}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.55;min-height:100vh;display:flex;flex-direction:column;font-size:15px;-webkit-font-smoothing:antialiased}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.2rem}
.card{max-width:440px;width:100%;padding:2.5rem 2rem;background:var(--white);border:1px solid var(--cream-3);border-radius:14px;box-shadow:0 4px 22px rgba(28,31,28,.06)}
.brand{text-align:center;margin-bottom:1.5rem}
.brand svg{width:32px;height:32px}
.brand-name{font-family:var(--serif);font-size:1rem;font-weight:500;color:var(--ink);margin-top:.35rem}
.title{font-family:var(--serif);font-size:1.45rem;font-weight:500;color:var(--ink);text-align:center;letter-spacing:-.01em;margin-bottom:.55rem;line-height:1.2}
.title em{font-style:normal;color:var(--forest)}
.sub{font-size:.85rem;color:var(--muted);line-height:1.6;text-align:center;margin-bottom:1.5rem;max-width:340px;margin-left:auto;margin-right:auto}
label{display:block;font-family:'DM Mono',monospace;font-size:.58rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem}
.input{width:100%;background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:.85rem 1rem;font-family:var(--sans);font-size:.95rem;color:var(--ink);outline:none;transition:border-color .15s;margin-bottom:.95rem}
.input:focus{border-color:var(--forest)}
.btn{width:100%;background:var(--forest);color:#fff;border:none;padding:.85rem 1.2rem;border-radius:10px;font-weight:500;font-size:.88rem;font-family:var(--sans);cursor:pointer}
.btn:hover:not(:disabled){background:var(--forest-2)}
.btn:disabled{background:var(--cream-3);color:var(--muted);cursor:not-allowed}
.error{margin-top:.7rem;padding:.6rem .8rem;background:rgba(160,48,48,.05);border:1px solid rgba(160,48,48,.2);border-radius:8px;font-size:.78rem;color:var(--rose);line-height:1.5}
.state{display:none}.state.active{display:block}
.icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;background:var(--sage-dim);border:1px solid var(--sage-border)}
.icon svg{width:22px;height:22px;stroke:var(--forest);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{padding:1rem;text-align:center;font-size:.7rem;color:#6a6e68}
.foot a{color:#6a6e68;text-decoration:underline;text-underline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="9" fill="#1c4a35"/><path d="M8 17 L20 9 L32 17" stroke="#7aaa8f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="20" width="24" height="2.5" rx=".5" fill="#7aaa8f"/><rect x="8" y="24.5" width="24" height="2.5" rx=".5" fill="#7aaa8f" opacity=".7"/><rect x="8" y="29" width="24" height="2.5" rx=".5" fill="#7aaa8f" opacity=".4"/></svg>
      <div class="brand-name">RoofRank</div>
    </div>

    <div class="state active" id="stateForm">
      <div class="title">Set a new <em>password</em>.</div>
      <div class="sub">Pick something you'll actually remember. 8+ characters.</div>
      <form onsubmit="return handleSubmit(event)">
        <label>New password</label>
        <input class="input" type="password" id="pw" required minlength="8" autocomplete="new-password" oninput="document.getElementById('err').style.display='none'">
        <label>Confirm</label>
        <input class="input" type="password" id="pw2" required minlength="8" autocomplete="new-password">
        <button class="btn" id="btn" type="submit">Reset password →</button>
        <div class="error" id="err" style="display:none"></div>
      </form>
    </div>

    <div class="state" id="stateSuccess">
      <div class="icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="title"><em>Reset</em> complete.</div>
      <div class="sub">You can sign in with your new password now.</div>
      <a class="btn" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none" href="roofrank-login.html">Sign in →</a>
    </div>
  </div>
</main>
<div class="foot">&copy; 2026 DevNest Dynamics, LLC &middot; <a href="/privacy.html">Privacy</a> &middot; <a href="/terms.html">Terms</a></div>

<script>
function showState(id){
  document.querySelectorAll('.state').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function handleSubmit(e){
  e.preventDefault();
  const pw  = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  err.style.display = 'none';
  if (pw !== pw2) {
    err.textContent = "Passwords don't match.";
    err.style.display = '';
    return false;
  }
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  if (!token) {
    err.textContent = "Reset link is missing its token. Request a fresh one from the sign-in page.";
    err.style.display = '';
    return false;
  }
  btn.disabled = true;
  btn.textContent = 'Resetting…';
  try {
    const res = await fetch(window.ROOFRANK_API_URL + '/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pw }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data?.error || data?.message || 'Failed to reset password. The link may have expired.');
    }
    showState('stateSuccess');
  } catch (e) {
    err.textContent = e.message;
    err.style.display = '';
    btn.disabled = false;
    btn.textContent = 'Reset password →';
  }
  return false;
}
</script>
</body>
</html>
