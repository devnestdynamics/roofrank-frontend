<!DOCTYPE html>
<html lang="en">
<head>
<script>window.ROOFRANK_API_URL="https://api.roofrank.io/api";</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoofRank — Deal Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#f7f4ef;--cream-2:#f0ece4;--cream-3:#e6e0d5;--white:#fff;
  --ink:#1c1f1c;--muted:#6b7168;--faint:#a8ad9f;
  --forest:#1c4a35;--forest-2:#2d6448;--forest-3:#3e8160;
  --sage:#7aaa8f;--sage-dim:rgba(122,170,143,.1);--sage-border:rgba(122,170,143,.25);
  --amber:#a06a00;--rose:#a03030;
  --border:#e0d9cf;--border-2:#cbc3b6;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
  --sw:240px;--r:10px
}
html{color-scheme:light}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.55;display:flex;min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
.sidebar{width:var(--sw);flex-shrink:0;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50}
.sb-top{padding:1rem 1.3rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;text-decoration:none}
.sb-name{font-family:var(--serif);font-size:.95rem;font-weight:500;color:var(--ink)}
.sb-user{padding:.75rem 1.3rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.6rem}
.sb-av{width:26px;height:26px;border-radius:50%;background:var(--forest-2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:500;flex-shrink:0}
.sb-uname{font-size:.78rem;font-weight:500;color:var(--ink)}
.sb-plan{font-size:.55rem;font-weight:600;color:var(--forest);background:var(--sage-dim);border:1px solid var(--sage-border);padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em;display:inline-block;margin-top:2px}
.sb-nav{padding:.4rem 0;flex:1;overflow-y:auto}
.sb-sect{font-size:.55rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:.5rem 1.3rem .2rem}
.sb-link{display:flex;align-items:center;gap:.6rem;padding:.5rem 1.3rem;font-size:.8rem;color:var(--muted);text-decoration:none;cursor:pointer;border:none;background:none;width:100%;text-align:left;border-left:2px solid transparent;transition:all .15s;font-family:var(--sans)}
.sb-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0;opacity:.6;stroke-linecap:round;stroke-linejoin:round}
.sb-link:hover{color:var(--ink);background:var(--cream)}
.sb-link.active{color:var(--forest);background:var(--sage-dim);border-left-color:var(--forest);font-weight:500}
.sb-link.active svg{opacity:1;stroke:var(--forest)}
.sb-count{margin-left:auto;background:var(--forest);color:#fff;font-size:.55rem;font-weight:600;font-family:var(--mono);padding:1px 5px;border-radius:8px;min-width:16px;text-align:center}
.sb-foot{padding:.75rem 1.3rem;border-top:1px solid var(--border);flex-shrink:0}
.sb-upgrade{display:block;width:100%;text-align:center;background:var(--forest);color:#fff;border:none;padding:.5rem;border-radius:var(--r);font-family:var(--sans);font-size:.76rem;font-weight:500;cursor:pointer;text-decoration:none}
.sb-upgrade:hover{background:var(--forest-2)}
.main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 1.4rem;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.tb-left{display:flex;align-items:baseline;gap:.55rem}
.tb-title{font-family:var(--serif);font-size:.95rem;font-weight:500;color:var(--ink)}
.tb-sub{font-size:.68rem;color:var(--muted)}
.tb-right{display:flex;gap:.45rem}
.btn-ghost{background:none;border:1px solid var(--border-2);color:var(--muted);padding:.32rem .75rem;border-radius:var(--r);font-size:.74rem;cursor:pointer;font-family:var(--sans);transition:all .15s}
.btn-ghost:hover{border-color:var(--forest);color:var(--forest)}
.btn-primary{background:var(--forest);color:#fff;border:none;padding:.35rem .9rem;border-radius:var(--r);font-size:.76rem;font-weight:500;cursor:pointer;font-family:var(--sans);transition:background .15s}
.btn-primary:hover{background:var(--forest-2)}
.content{padding:1.3rem 1.4rem 4rem;flex:1}

/* ── MOBILE BOTTOM NAV (replaces sidebar below 860px) ────────────────── */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:60;box-shadow:0 -6px 20px rgba(28,31,28,.06);padding-bottom:env(safe-area-inset-bottom,0)}
.bnav-inner{display:flex;align-items:stretch;max-width:520px;margin:0 auto}
.bn-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:.55rem .4rem;color:var(--muted);text-decoration:none;font-family:var(--sans);font-size:.62rem;font-weight:500;background:none;border:none;cursor:pointer;transition:color .12s;position:relative;letter-spacing:.02em}
.bn-tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn-tab.active{color:var(--forest)}
.bn-tab.active::before{content:'';position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--forest);border-radius:0 0 2px 2px}
.bn-tab .bn-badge{position:absolute;top:4px;right:50%;transform:translateX(18px);background:var(--forest);color:#fff;font-size:.5rem;font-weight:700;font-family:var(--mono);padding:1px 4px;border-radius:8px;min-width:14px;text-align:center;line-height:1.2}
.bn-sheet{display:none;position:fixed;inset:0;z-index:70;background:rgba(20,32,26,.5);align-items:flex-end;justify-content:center;animation:bnFadeIn .2s ease-out}
.bn-sheet.open{display:flex}
@keyframes bnFadeIn{from{opacity:0}to{opacity:1}}
.bn-sheet-card{width:100%;max-width:520px;background:#fff;border-radius:14px 14px 0 0;padding:.85rem 1rem 1.4rem;animation:bnSlideUp .25s ease-out;padding-bottom:calc(1.4rem + env(safe-area-inset-bottom,0))}
@keyframes bnSlideUp{from{transform:translateY(20px)}to{transform:translateY(0)}}
.bn-sheet-grip{width:38px;height:4px;background:var(--border-2);border-radius:2px;margin:0 auto .9rem}
.bn-sheet-link{display:flex;align-items:center;gap:.7rem;padding:.85rem .35rem;font-size:.9rem;color:var(--ink);text-decoration:none;border:none;background:none;width:100%;text-align:left;cursor:pointer;font-family:var(--sans);font-weight:500;border-radius:8px}
.bn-sheet-link:hover{background:var(--cream-2)}
.bn-sheet-link svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0;opacity:.7;stroke-linecap:round;stroke-linejoin:round}
.bn-sheet-link + .bn-sheet-link{border-top:1px solid var(--cream-2)}
@media(max-width:860px){.bnav{display:block}}

/* ── ANALYST'S BRIEF — dashboard AI moment, matches detail page Analyst ── */
.ana-brief{margin-bottom:1.2rem}
.ana-brief-card{
  background:linear-gradient(180deg,#1d2420 0%,#14201a 100%);
  color:#fff;border-radius:12px;padding:1.4rem 1.4rem;
  box-shadow:0 4px 22px rgba(20,32,26,.15);position:relative;overflow:hidden;
}
.ana-brief-head{display:flex;align-items:center;gap:.55rem;padding-bottom:1rem;margin-bottom:1rem;border-bottom:1px solid rgba(255,255,255,.08)}
.ana-brief-dot{width:8px;height:8px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 4px rgba(122,170,143,.16);animation:abPulse 2.4s ease-in-out infinite;flex-shrink:0}
@keyframes abPulse{0%,100%{box-shadow:0 0 0 4px rgba(122,170,143,.16)}50%{box-shadow:0 0 0 7px rgba(122,170,143,.05)}}
.ana-brief-title{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.9)}
.ana-brief-day{font-size:.72rem;color:rgba(255,255,255,.4);font-style:italic;margin-left:.15rem}
.ana-brief-badge{font-size:.6rem;font-weight:700;letter-spacing:.1em;background:rgba(122,170,143,.2);color:var(--sage);padding:.2rem .5rem;border-radius:4px;margin-left:auto}
.ana-brief-body{font-family:var(--serif);font-size:1.02rem;line-height:1.65;color:rgba(255,255,255,.9);font-style:italic;font-weight:400;margin-bottom:1.1rem}
.ana-brief-body b{color:#fff;font-weight:600;font-style:normal}
.ana-brief-body::before{content:'"';font-size:2.2rem;color:var(--sage);line-height:0;margin-right:.15rem;vertical-align:-.35em;font-style:normal;font-family:var(--serif)}
.ana-brief-picks{display:flex;gap:.6rem;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;margin:0 -1.4rem;padding-left:1.4rem;padding-right:1.4rem}
.ana-brief-picks::-webkit-scrollbar{display:none}
.ana-brief-pick{flex-shrink:0;min-width:240px;max-width:260px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:.85rem .9rem;cursor:pointer;transition:all .15s}
.ana-brief-pick:hover{background:rgba(255,255,255,.08);border-color:rgba(122,170,143,.3);transform:translateY(-1px)}
.ana-brief-pick-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.45rem}
.ana-brief-pick-score{width:30px;height:30px;border-radius:50%;background:var(--sage);color:#1c1f1c;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.78rem;font-weight:600;flex-shrink:0}
.ana-brief-pick-sig{font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sage)}
.ana-brief-pick-addr{font-family:var(--serif);font-size:.88rem;font-weight:500;color:#fff;margin-bottom:.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ana-brief-pick-meta{font-size:.7rem;color:rgba(255,255,255,.5);margin-bottom:.35rem}
.ana-brief-pick-cf{font-family:var(--mono);font-size:.85rem;font-weight:500;color:var(--sage)}
.ana-brief-pick-cf.r{color:#ff9b9b}

/* ── DEAL CARD micro-take (one-line italic analyst voice per card) ────── */
.dtake{font-family:var(--serif);font-style:italic;font-size:.78rem;color:var(--muted);margin-top:.45rem;line-height:1.4}
.dtake::before{content:'"';color:var(--sage);font-style:normal;margin-right:2px}
.dtake::after{content:'"';color:var(--sage);font-style:normal;margin-left:1px}

.mkt-strip{display:flex;gap:.35rem;overflow-x:auto;margin-bottom:1.1rem;padding-bottom:.25rem;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-right:.75rem}
.mkt-strip::-webkit-scrollbar{display:none}
.mkt-chip{flex-shrink:0;white-space:nowrap;background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:.4rem .8rem;cursor:pointer;transition:all .15s}
.mkt-chip.on{border-color:var(--forest);background:var(--sage-dim)}
.mkt-chip-n{font-size:.75rem;font-weight:500;color:var(--ink)}
.mkt-chip.on .mkt-chip-n{color:var(--forest)}
.mkt-chip-m{font-size:.6rem;color:var(--muted);font-family:var(--mono)}
.controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;flex-wrap:wrap;gap:.5rem}
.ctrl-left{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap}
.ctrl-title{font-family:var(--serif);font-size:.88rem;font-weight:500;color:var(--ink);margin-right:.1rem}
.pill{padding:.25rem .7rem;border-radius:20px;font-size:.7rem;cursor:pointer;border:1px solid var(--border);background:none;color:var(--muted);font-family:var(--sans);transition:all .14s}
.pill:hover{border-color:var(--sage-border);color:var(--ink)}
.pill.on{background:var(--sage-dim);border-color:var(--sage-border);color:var(--forest);font-weight:500}
.sort-sel{padding:.26rem .55rem;border-radius:var(--r);border:1px solid var(--border);background:var(--white);font-size:.7rem;color:var(--muted);font-family:var(--sans);cursor:pointer;outline:none}
.deal{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:.8rem .95rem;display:flex;align-items:center;gap:.8rem;cursor:pointer;transition:all .14s;margin-bottom:.4rem;position:relative;overflow:hidden;opacity:0;animation:fu .28s ease forwards}
@keyframes fu{to{opacity:1;transform:none}from{opacity:0;transform:translateY(5px)}}
.new-divider{display:flex;align-items:center;gap:.75rem;margin:.6rem 0 .5rem;opacity:0;animation:fu .3s ease .2s forwards}
.new-divider-line{flex:1;height:1px;background:linear-gradient(90deg,var(--forest-3),transparent)}
.new-divider-label{font-size:.64rem;font-weight:600;color:var(--forest);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;background:var(--sage-dim);border:1px solid var(--sage-border);padding:2px 8px;border-radius:4px;flex-shrink:0}
.new-divider-line.right{background:linear-gradient(270deg,var(--forest-3),transparent)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
.fresh-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--forest-3);animation:pulse 1.8s ease-in-out infinite;margin-right:4px;vertical-align:middle;flex-shrink:0}
.fresh-dot.hot{background:var(--amber)}
.deal:hover{border-color:var(--sage-border);box-shadow:0 3px 14px rgba(28,31,28,.07);transform:translateY(-1px)}
.deal::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.deal.sb{
  padding:.95rem 1rem;
  border-color:rgba(28,74,53,.22);
  box-shadow:0 2px 0 0 var(--forest), 0 4px 20px rgba(28,74,53,.1);
}
.deal.sb::before{background:var(--forest);width:4px}
.deal.sb .ring{width:56px;height:56px}
.deal.sb .daddr{font-size:.94rem}
.deal.buy::before{background:var(--forest-3)}
.deal.wat::before{background:var(--amber)}
.deal.pas::before{background:var(--rose)}
.ring{width:48px;height:48px;flex-shrink:0;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rt{fill:none;stroke:var(--cream-3);stroke-width:4}
.rf{fill:none;stroke-width:4;stroke-linecap:round}
.rn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.85rem;font-weight:500}
.dbody{flex:1;min-width:0}
.daddr{font-family:var(--serif);font-size:.87rem;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.dmeta{font-size:.68rem;color:var(--muted);margin-bottom:4px}
.dkpis{display:flex;gap:.28rem;flex-wrap:wrap}
.kp{font-size:.62rem;font-family:var(--mono);padding:2px 5px;border-radius:3px;border:1px solid var(--border);color:var(--muted);background:var(--cream)}
.kp.g{color:var(--forest);border-color:var(--sage-border);background:var(--sage-dim)}
.dright{text-align:right;flex-shrink:0;min-width:80px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sbadge{font-size:.58rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid}
.sbadge.sb{background:rgba(28,74,53,.08);color:var(--forest);border-color:rgba(28,74,53,.2)}
.sbadge.buy{background:rgba(62,129,96,.07);color:var(--forest-3);border-color:rgba(62,129,96,.2)}
.sbadge.wat{background:rgba(160,106,0,.08);color:var(--amber);border-color:rgba(160,106,0,.2)}
.sbadge.pas{background:rgba(160,48,48,.07);color:var(--rose);border-color:rgba(160,48,48,.2)}
.dprice{font-family:var(--mono);font-size:.8rem;color:var(--ink)}
.ddom{font-size:.62rem;color:var(--muted)}
.wbtn{background:none;border:none;cursor:pointer;color:var(--faint);line-height:0;padding:4px;transition:color .14s;flex-shrink:0}
.wbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.wbtn:hover,.wbtn.on{color:var(--forest)}
.wbtn.on svg{fill:var(--forest);stroke:var(--forest)}
.empty{text-align:center;padding:3.5rem 1.5rem}
.empty-ic{width:44px;height:44px;border-radius:50%;background:var(--sage-dim);border:1px solid var(--sage-border);display:flex;align-items:center;justify-content:center;margin:0 auto .9rem}
.empty-ic svg{width:18px;height:18px;stroke:var(--forest);fill:none;stroke-width:1.8}
.empty-t{font-family:var(--serif);font-size:.95rem;color:var(--ink);margin-bottom:.3rem}
.empty-s{font-size:.78rem;color:var(--muted);max-width:260px;margin:0 auto .9rem;line-height:1.6}
.empty-btn{background:var(--forest);color:#fff;border:none;padding:.48rem 1.1rem;border-radius:var(--r);font-size:.76rem;cursor:pointer;font-family:var(--sans)}
.skel-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:.8rem .95rem;display:flex;align-items:center;gap:.8rem;margin-bottom:.4rem}
.sk{background:linear-gradient(90deg,var(--cream-2) 25%,var(--cream-3) 50%,var(--cream-2) 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:5px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media(max-width:860px){.sidebar{display:none}.main{margin-left:0;padding:.75rem}.tb-right{display:none}}
@media(max-width:540px){
  .content{padding:1rem .9rem 5.5rem}
  .topbar{padding:0 .9rem}
  .topbar{display:none}
  .main{padding-top:0}
  .ctrl-title{display:none}
  .deal{padding:.85rem .85rem;gap:.7rem}
  .ring{width:48px;height:48px}
  .deal.sb .ring{width:52px;height:52px}
  .rn{font-size:.88rem}
  .daddr{font-size:.92rem;line-height:1.3}
  .dmeta{font-size:.72rem;margin-bottom:6px}
  .kp{font-size:.66rem;padding:2px 6px}
  /* Mobile: drop DSCR + percentile chip to reduce density */
  .kp[data-metric="dscr"]{display:none}
  .ddom[data-pct]{display:none}
  .dprice{font-size:.88rem}
  .sbadge{font-size:.6rem;padding:3px 7px}
  .ddom{font-size:.68rem}
  .dtake{font-size:.85rem;line-height:1.5;margin-top:.55rem}
  .controls{flex-direction:column;align-items:flex-start}
  .tb-left{flex-direction:column;align-items:flex-start;gap:.1rem}
  .tb-sub{font-size:.62rem}
  .btn-primary{font-size:.72rem;padding:.3rem .7rem}
  .btn-ghost{font-size:.72rem;padding:.3rem .65rem}
}

@media(max-width:600px){
  .ana-brief-card{padding:1.15rem 1.15rem;border-radius:10px}
  .ana-brief-body{font-size:.95rem}
  .ana-brief-picks{margin:0 -1.15rem;padding-left:1.15rem;padding-right:1.15rem}
  .ana-brief-pick{min-width:220px}
}

@media(max-width:430px){
  /* Deal cards — metric badges on one scrollable row */
  .dkpis{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:.25rem;padding-bottom:2px}
  .dkpis::-webkit-scrollbar{display:none}
  .kp{flex-shrink:0;font-size:.65rem;padding:.18rem .45rem}
  .daddr{font-size:.82rem}
  .dmeta{font-size:.62rem}
  .dprice{font-size:.8rem}
  .sbadge{font-size:.58rem;padding:.18rem .4rem}

  /* Market chips — scroll hint via fade */  
  .mkt-strip{padding-right:2rem;mask-image:linear-gradient(to right,black 85%,transparent 100%);-webkit-mask-image:linear-gradient(to right,black 85%,transparent 100%)}

  /* Feed header */
  .tb{font-size:.85rem}
  .tb-sub{font-size:.6rem}

  /* Top bar buttons */
  .btn-refresh{display:none}
}
</style>
<script src="api.js"></script>
</head>
<body>
<aside class="sidebar">
  <a href="roofrank-landing.html" class="sb-top">
    <svg width="26" height="26" viewBox="0 0 30 30" fill="none"><rect width="30" height="30" rx="7" fill="#1c4a35"/><path d="M5 17L15 7L25 17" stroke="#7aaa8f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="22" width="4" height="6" rx="1" fill="#7aaa8f" opacity=".35"/><rect x="13" y="17" width="4" height="11" rx="1" fill="#7aaa8f" opacity=".6"/><rect x="20" y="12" width="4" height="16" rx="1" fill="#7aaa8f"/></svg>
    <span class="sb-name">RoofRank</span>
  </a>
  <div class="sb-user">
    <div class="sb-av" id="sbAv">?</div>
    <div><div class="sb-uname" id="sbName">Loading…</div><span class="sb-plan" id="sbPlan">Starter</span></div>
  </div>
  <nav class="sb-nav">

<script>
let page=1, minScore=0, filterCity='', filterState='', allDeals=[];
const circ=2*Math.PI*19;

async function boot(){
  // Load feed immediately — don't wait for sidebar calls
  loadMktStats();
  loadFeed();
  syncWC();

  // Load sidebar info in background (non-blocking)
  AuthAPI.me().then(({user}={})=>{
    if(!user) return;
    document.getElementById('sbAv').textContent=(user.name||user.email||'?')[0].toUpperCase();
    document.getElementById('sbName').textContent=user.name||user.email;
  }).catch(()=>{});

  BillingAPI.getSubscription().then(sub=>{
    if(!sub) return;
    document.getElementById('sbPlan').textContent=(sub.plan||'starter').replace(/^./,c=>c.toUpperCase());
    const used=sub.reportsUsed||0, lim=sub.reportLimit||10;
    document.getElementById('sbUsage').textContent=`${used}/${lim}`;
    document.getElementById('sbFill').style.width=Math.min(100,used/lim*100)+'%';
  }).catch(()=>{});

  WatchlistAPI.loadIds().then(()=>syncWC()).catch(()=>{});
}

// One-line analyst voice per deal card. Returns '' for middle-of-the-road deals
// so the feed isn't dotted with identical italic lines — the rule is: only speak
// when there's something the badges and score ring don't already say.
function dealTake(d, fin, score){
  const cf  = fin.monthlyCashFlow;
  const dscr= fin.dscr;
  const coc = fin.cashOnCashReturn;
  const dom = d.daysOnMarket;

  // Relative position across the current feed — picks up "top earner" / "top scored"
  // language that no individual badge can express
  const universe = (typeof allDeals !== 'undefined' && allDeals) ? allDeals : [];
  let isTopCf = false, isTopScore = false;
  if(universe.length > 1){
    const cfs = universe.map(x => x.reportData?.financials?.monthlyCashFlow).filter(v => v != null);
    if(cfs.length){
      const maxCf = Math.max(...cfs);
      isTopCf = cf != null && Math.abs(cf - maxCf) < 1 && cf > 0;
    }
    const maxScore = Math.max(...universe.map(x => x.rankScore || 0));
    isTopScore = score === maxScore && score >= 75;
  }

  // Concerns first — always loud
  if(cf != null && cf < -200) return `Loses $${Math.round(Math.abs(cf)).toLocaleString()}/mo — pass unless seller cuts hard`;
  if(cf != null && cf < 0)    return `Slight monthly loss — only pencils at lower rates`;
  if(dscr != null && dscr < 1.0) return `DSCR of ${dscr.toFixed(2)} — most lenders won't fund this`;
  if(dscr != null && dscr < 1.15 && score < 70) return `Tight DSCR at ${dscr.toFixed(2)} — confirm financing first`;

  // Relative standouts in this feed
  if(isTopCf && isTopScore) return `Top score and top cash flow on this page`;
  if(isTopCf)               return `Highest cash flow in your feed`;
  if(isTopScore)            return `Highest-scored deal in your markets right now`;

  // Time-based — uses specific numbers, distinct from the DOM line below
  if(dom != null && dom >= 90 && score >= 60) return `Sat ${dom}d — seller is likely tired`;
  if(dom != null && dom >= 60 && score >= 60) return `Stale at ${dom}d, real pricing leverage`;
  if(dom != null && dom <= 3  && score >= 70) return `Listed ${dom}d ago — first-mover window`;
  if(dom != null && dom <= 7  && score >= 75) return `Fresh listing, strong fundamentals`;

  // Extremes — say something when score is unusually high or low.
  // Vary the phrasing based on which dimension is most distinctive so
  // adjacent cards with similar profiles don't echo each other.
  if(score >= 82 && coc != null && coc >= 15) return `${coc.toFixed(1)}% return is rare territory`;
  if(score >= 82 && coc != null && coc >= 12) return `${coc.toFixed(1)}% cash-on-cash, clean DSCR`;
  if(score >= 82 && cf != null && cf > 1800)  return `Earns $${Math.round(cf).toLocaleString()}/mo — top-tier deal`;
  if(score >= 82)                              return `${score}/100 — top-tier scoring`;
  if(score < 45)                               return `${score}/100 — below investment thresholds`;
  if(score < 60 && dom != null && dom >= 60)   return `Weak deal sitting ${dom}d — sellers will eventually fold`;
  if(score < 60)                               return `Marginal — only works with material negotiation`;

  // Middle-of-the-road — let the badges and signal carry the load
  return '';
}

// Analyst's Brief — editorial summary across the loaded feed
function renderAnalystBrief(deals){
  const section = document.getElementById('anaBriefSection');
  if(!section || !deals || !deals.length) return;
  section.style.display = '';

  // Day-of-week + time-of-day phrase
  const dayEl = document.getElementById('anaBriefDay');
  if(dayEl){
    const now = new Date();
    const day = now.toLocaleDateString('en-US', { weekday: 'long' });
    const hour = now.getHours();
    const tod = hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening';
    dayEl.textContent = day + ' ' + tod;
  }

  // Stats over the loaded feed
  const strongCount = deals.filter(d => (d.rankScore || 0) >= 75).length;
  const buyCount    = deals.filter(d => (d.rankScore || 0) >= 60).length;
  const freshCount  = deals.filter(d => (d.daysOnMarket || 999) <= 7).length;
  const motivatedCount = deals.filter(d => (d.daysOnMarket || 0) >= 60).length;

  // City context — collapse to a readable phrase
  const cityCounts = {};
  deals.forEach(d => { if(d.city) cityCounts[d.city] = (cityCounts[d.city]||0)+1; });
  const sortedCities = Object.entries(cityCounts).sort((a,b)=>b[1]-a[1]).map(c=>c[0]);
  const cityCtx = sortedCities.length === 0 ? 'your markets'
                : sortedCities.length === 1 ? sortedCities[0]
                : sortedCities.length === 2 ? sortedCities.join(' and ')
                : 'your markets';

  // Picks — top 1-3 by score
  const picks = [...deals].sort((a,b)=>(b.rankScore||0)-(a.rankScore||0)).slice(0, 3);
  const top = picks[0];
  const topShortAddr = top?.address?.split(',')[0] || 'a top-scored deal';
  const topCity = top?.city || cityCtx;
  const topFin = top?.reportData?.financials || {};

  // Compose the body
  let body = '';
  if(strongCount > 0){
    body = `<b>${strongCount} Strong Buy${strongCount>1?'s':''}</b> on the board in ${cityCtx} ${dayEl?.textContent ? 'this '+(new Date().getHours()<12?'morning':'afternoon') : 'today'}. `;
    body += `Standout: <b>${topShortAddr}</b> in ${topCity}`;
    if(topFin.cashOnCashReturn != null && topFin.monthlyCashFlow > 0){
      body += ` — <b>${topFin.cashOnCashReturn.toFixed(1)}%</b> cash-on-cash with <b>$${Math.round(topFin.monthlyCashFlow).toLocaleString()}/mo</b> coming in. `;
    } else if(top?.rankScore) {
      body += ` — scoring <b>${top.rankScore}/100</b>. `;
    } else { body += '. '; }
    if(freshCount > 0) body += `${freshCount} fresh listing${freshCount>1?'s':''} this week. `;
    if(motivatedCount > 0) body += `${motivatedCount} seller${motivatedCount>1?'s have':' has'} sat 60+ days — pricing leverage there.`;
  } else if(buyCount > 0){
    body = `<b>${buyCount}</b> deal${buyCount>1?'s':''} scoring Buy in ${cityCtx} — solid but nothing exceptional. `;
    body += `Worth analyzing the top one or two before they go stale. `;
    if(motivatedCount > 0) body += `<b>${motivatedCount}</b> motivated seller${motivatedCount>1?'s':''} sitting on the market.`;
  } else {
    body = `Thin pickings in ${cityCtx} today — <b>${deals.length}</b> deal${deals.length>1?'s':''} but nothing scoring strong. `;
    body += `Markets like this favor patient buyers; check back tomorrow after the nightly refresh.`;
  }

  setHTML('anaBriefBody', body);

  // Picks carousel
  const picksEl = document.getElementById('anaBriefPicks');
  if(picksEl){
    picksEl.innerHTML = picks.map(p => {
      const fin = p.reportData?.financials || {};
      const cf = fin.monthlyCashFlow;
      const sig = scoreSignal(p.rankScore || 0);
      const cfHtml = cf != null
        ? `<div class="ana-brief-pick-cf${cf<0?' r':''}">${cf>=0?'+':'−'}$${Math.round(Math.abs(cf)).toLocaleString()}/mo</div>`
        : '';
      return `<div class="ana-brief-pick" onclick="openDeal('${p.id}',event)">
        <div class="ana-brief-pick-head">
          <div class="ana-brief-pick-score">${p.rankScore || '—'}</div>
          <div class="ana-brief-pick-sig">${sig}</div>
        </div>
        <div class="ana-brief-pick-addr">${(p.address || 'Unknown').split(',')[0]}</div>
        <div class="ana-brief-pick-meta">${[p.city, p.state].filter(Boolean).join(', ')} · ${p.units || '?'} units${p.daysOnMarket != null ? ' · ' + p.daysOnMarket + 'd' : ''}</div>
        ${cfHtml}
      </div>`;
    }).join('');
  }
}

function setHTML(id, html){ const el = document.getElementById(id); if(el) el.innerHTML = html; }

async function loadFeed(reset=true){
  if(reset){page=1;allDeals=[];}
  const list=document.getElementById('dealList');
  if(reset) list.innerHTML=skels(6);
  const sort=(document.getElementById('sortSel')||{}).value||'score';
  try{
    const data = await FeedAPI.list({page,limit:20,minScore,...(filterCity&&{city:filterCity,state:filterState}),sort});
    const deals = data.deals || [];
    allDeals = reset ? deals : [...allDeals, ...deals];
    renderDeals(allDeals, reset);

    // Track visit timestamp for "new since" divider in the feed list
    const prevVisit = localStorage.getItem('rr_last_visit');
    if(prevVisit) localStorage.setItem('rr_last_visit_prev', prevVisit);
    localStorage.setItem('rr_last_visit', new Date().toISOString());

    const _sb=document.getElementById('sbBadge'); if(_sb) _sb.textContent=allDeals.length;
    const _ts=document.getElementById('topSub');
    if(_ts){
      const now=new Date();
      const hour=now.getHours();
      const lastRun=new Date(now);
      if(hour<2) lastRun.setDate(lastRun.getDate()-1);
      lastRun.setHours(2,0,0,0);
      const hoursAgo=Math.round((now-lastRun)/3600000);
      const timeStr=hoursAgo<1?'just now':hoursAgo===1?'1 hour ago':hoursAgo+' hours ago';
      _ts.textContent=allDeals.length+' ranked deal'+(allDeals.length!==1?'s':'')+' · Updated '+timeStr;
    }
    const lmw=document.getElementById('loadMoreWrap'); if(lmw) lmw.style.display=deals.length===20?'flex':'none';

    // Analyst's brief — runs after deals are populated so it can synthesize over the feed
    renderAnalystBrief(allDeals);
  } catch(e) {
    console.error('loadFeed error:', e);
    if(reset) list.innerHTML = '<div class="empty"><div class="empty-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><div class="empty-t">Could not load deals</div><div class="empty-s">Check your connection and try again.</div><button class="empty-btn" onclick="loadFeed()">Try Again</button></div>';
  }
}
function renderDeals(deals, reset=true){
  const list=document.getElementById('dealList');
  if(!deals.length){list.innerHTML=`<div class="empty"><div class="empty-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><div class="empty-t">No deals match</div><div class="empty-s">Try removing filters or check back tomorrow after the nightly refresh.</div><button class="empty-btn" onclick="resetFilters()">Clear Filters</button></div>`;return;}
  // Track last visit for "new since" divider
  const lastVisit = localStorage.getItem('rr_last_visit');
  const lastVisitDate = lastVisit ? new Date(lastVisit) : null;
  const newCount = lastVisitDate
    ? deals.filter(d => new Date(d.createdAt) > lastVisitDate).length
    : 0;
  localStorage.setItem('rr_last_visit', new Date().toISOString());

  let dividerInjected = false;
  list.innerHTML=deals.map((d,i)=>{
    const isNew = lastVisitDate && new Date(d.createdAt) > lastVisitDate;
    const isFirstOld = !dividerInjected && !isNew && newCount > 0 && i > 0;
    if(isFirstOld) dividerInjected = true;
    const dividerHtml = isFirstOld
      ? `<div class="new-divider"><div class="new-divider-line"></div><div class="new-divider-label">↑ ${newCount} new since your last visit</div><div class="new-divider-line right"></div></div>`
      : '';
    return dividerHtml + dealCardHtml(d, i);
  }).join('');
}

function getPercentile(score, allDeals){
  if(!allDeals || !allDeals.length) return null;
  const below = allDeals.filter(d => (d.rankScore||0) < score).length;
  const pct = Math.round((below / allDeals.length) * 100);
  if(pct >= 90) return 'Top 10%';
  if(pct >= 80) return 'Top 20%';
  if(pct >= 70) return 'Top 30%';
  return null; // only show for top 30%
}

function dealCardHtml(d,i){
    const score=d.rankScore||0, fin=(d.reportData||{}).financials||{};
    const sig=scoreSignal(score), cl=scoreClass(score), c=scoreColor(score);
    const dash=(score/100)*circ;
    const on=WatchlistAPI.has(d.id);
    const pct=getPercentile(score,allDeals);
    const take=dealTake(d,fin,score);
    return`<div class="deal ${cl}" style="animation-delay:${Math.min(i*.04,.4)}s" onclick="openDeal('${d.id}',event)">
      <div class="ring" title="${pct?pct+' in this feed':''}"><svg viewBox="0 0 42 42" style="transform:rotate(-90deg)"><circle class="rt" cx="21" cy="21" r="19"/><circle class="rf" cx="21" cy="21" r="19" stroke="${c}" stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}"/></svg><div class="rn" style="color:${c}">${score||'—'}</div></div>
      <div class="dbody">
        <div class="daddr">${d.address||'Unknown'}</div>
        <div class="dmeta">${[d.city,d.state].filter(Boolean).join(', ')} · ${d.units||'—'} units${d.propertyType?' · '+d.propertyType:''}</div>
        <div class="dkpis">
          ${fin.cashOnCashReturn!=null?`<span class="kp ${fin.cashOnCashReturn>=8?'g':''}">CoC ${fin.cashOnCashReturn.toFixed(1)}%</span>`:''}
          ${fin.capRate!=null?`<span class="kp ${fin.capRate>=6.5?'g':''}">Cap ${fin.capRate.toFixed(1)}%</span>`:''}
          ${fin.dscr!=null?`<span class="kp ${fin.dscr>=1.25?'g':''}" data-metric="dscr">DSCR ${fin.dscr.toFixed(2)}</span>`:''}
          ${fin.monthlyCashFlow!=null?`<span class="kp ${fin.monthlyCashFlow>=0?'g':'r'}">${fin.monthlyCashFlow>=0?'+':''}$${Math.round(Math.abs(fin.monthlyCashFlow)).toLocaleString()}/mo</span>`:''}
        </div>
        ${take ? `<div class="dtake">${take}</div>` : ''}
      </div>
      <div class="dright">
        <span class="sbadge ${cl}">${sig}</span>
        <div class="dprice">${fmtPrice(d.askingPrice)}</div>
        ${pct?`<div class="ddom" data-pct="1" style="color:var(--forest);font-weight:500">${pct}</div>`:''}
        ${d.daysOnMarket!=null?`<div class="ddom">${d.daysOnMarket<=2?'<span class="fresh-dot"></span>':d.daysOnMarket<=5?'<span class="fresh-dot hot"></span>':''}${d.daysOnMarket}d listed</div>`:''}
        <button class="wbtn ${on?'on':''}" onclick="toggleW('${d.id}',event)"><svg viewBox="0 0 24 24" fill="${on?c:'none'}" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg></button>
      </div>
    </div>`;
}

function openDeal(id,e){
  if(e.target.closest('.wbtn')) return;
  const deal = allDeals.find(d=>d.id===id);
  if(deal) sessionStorage.setItem('rr_deal_'+id, JSON.stringify(deal));
  location.href=`roofrank-deal-detail.html?fid=${id}`;
}
async function toggleW(id,e){
  e.stopPropagation();
  const btn = e.currentTarget;
  const on = await WatchlistAPI.toggle(id);
  if(btn) {
    btn.className = 'wbtn' + (on ? ' on' : '');
    const svg = btn.querySelector('svg');
    if(svg) svg.setAttribute('fill', on ? scoreColor(75) : 'none');
  }
  syncWC();
}
function syncWC(){
  const n=WatchlistAPI.count();
  const b=document.getElementById('wc'); if(b){b.textContent=n;b.style.display=n?'':'none';}
  const m=document.getElementById('bnWatchBadge'); if(m){m.textContent=n;m.style.display=n?'':'none';}
}

function setFilter(el,min){document.querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));el.classList.add('on');minScore=min;loadFeed();}
function resetFilters(){minScore=0;filterCity=filterState='';document.querySelectorAll('.pill').forEach((p,i)=>p.classList.toggle('on',i===0));document.querySelectorAll('.mkt-chip').forEach((c,i)=>c.classList.toggle('on',i===0));loadFeed();}
function filterMkt(el,city,state){document.querySelectorAll('.mkt-chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');filterCity=city;filterState=state;loadFeed();}
async function loadMktStats(){
  try{
    const data=await FeedAPI.marketStats();
    const mkts=Array.isArray(data)?data:(data.rows||[]);
    const strip=document.getElementById('mktStrip');
    if(strip && mkts.length){
      strip.innerHTML=`<div class="mkt-chip on" onclick="filterMkt(this,'','')"><div class="mkt-chip-n">All Markets</div><div class="mkt-chip-m">${allDeals.length||'—'} deals</div></div>`
        +mkts.slice(0,8).map(m=>`<div class="mkt-chip" onclick="filterMkt(this,'${m.city}','${m.state}')"><div class="mkt-chip-n">${m.city}</div><div class="mkt-chip-m">${m.state} · avg ${Math.round(m.avg_score||0)} · ${m.total_listings||0}</div></div>`).join('');
    }
  }catch{}
}
async function loadMore(){page++;await loadFeed(false);}
async function handleRefresh(btn){
  btn.disabled=true;
  btn.innerHTML='<span style="display:inline-block;width:12px;height:12px;border:2px solid var(--border-2);border-top-color:var(--forest);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px"></span>Refreshing…';
  try{
    await FeedAPI.triggerRefresh();
    btn.disabled=false;btn.textContent='↻ Refresh';
    document.querySelector('.tb-sub').textContent='38 ranked deals · Updated just now';
    showToast('✓ Feed refresh queued — new deals appear within minutes');
  }catch{
    btn.disabled=false;btn.textContent='↻ Refresh';
    showToast('Could not trigger refresh.','error');
  }
}
function skels(n){return Array.from({length:n}).map((_,i)=>`<div class="skel-card" style="opacity:${1-i*.1}"><div class="sk" style="width:46px;height:46px;border-radius:50%"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div class="sk" style="height:13px;width:52%"></div><div class="sk" style="height:10px;width:35%"></div><div style="display:flex;gap:5px"><div class="sk" style="height:18px;width:58px;border-radius:3px"></div><div class="sk" style="height:18px;width:52px;border-radius:3px"></div></div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px"><div class="sk" style="height:16px;width:62px;border-radius:3px"></div><div class="sk" style="height:12px;width:48px"></div></div></div>`).join('');}

document.addEventListener("DOMContentLoaded", boot);
</script>
